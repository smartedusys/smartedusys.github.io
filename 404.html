<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة - 404</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <script>
    (function() {
      var path = window.location.pathname;

      // تحويل تلقائي فوري إذا دخل المستخدم من الرابط السابق الذي يحتوي على /smartedusys/
      if (path.indexOf('/smartedusys') === 0) {
        var cleanPath = path.substring('/smartedusys'.length);
        if (!cleanPath || cleanPath === '/') cleanPath = '/index.html';
        window.location.replace(cleanPath + window.location.search + window.location.hash);
        return;
      }

      // تحويل تلقائي إذا تم إدخال /admin بدون .html أو الرابط القديم udaragg
      if (path === '/admin' || path === '/admin/' || path.indexOf('udaragg') !== -1) {
        window.location.replace('/admin.html' + window.location.search + window.location.hash);
        return;
      }
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #0f2c52, #1e4d8b);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
    }
    .error-code {
      font-size: 120px;
      font-weight: 900;
      opacity: 0.15;
      line-height: 1;
      margin-bottom: -30px;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    h1 {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      opacity: 0.8;
      line-height: 1.8;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      padding: 14px 40px;
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      color: #0f2c52;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      font-family: 'Tajawal', sans-serif;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(245, 158, 11, 0.5); }
    .btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <div class="icon">🔍</div>
    <h1>الصفحة غير موجودة</h1>
    <p>عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها.</p>
    <a href="index.html" class="btn">العودة للصفحة الرئيسية</a>
  </div>
</body>
</html>
